  <text x="400" y="555" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff" fill-opacity="0.7">MAZHI AMRAVATI • AMRAVATI MUNICIPAL CORPORATION (AMC)</text>
